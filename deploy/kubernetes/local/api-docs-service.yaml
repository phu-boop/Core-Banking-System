apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-docs-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-docs-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-docs-service
    spec:
      containers:
        - name: api-docs-service
          image: core-banking/api-docs-service:ci
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: core-banking-runtime
          env:
            - name: SERVER_PORT
              value: "8090"
          ports:
            - name: http
              containerPort: 8090
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api-docs-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-docs-service
  ports:
    - name: http
      port: 8090
      targetPort: http
