apiVersion: apps/v1
kind: Deployment
metadata:
  name: corporate-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: corporate-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corporate-service
    spec:
      containers:
        - name: corporate-service
          image: core-banking/corporate-service:ci
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: core-banking-runtime
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: CORPORATE_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/core_banking
            - name: CORPORATE_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: corporate-service-db-credentials
                  key: username
            - name: CORPORATE_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: corporate-service-db-credentials
                  key: password
            - name: CORPORATE_TOKEN_AUDIENCE
              value: corporate-service
            - name: CORPORATE_PARTY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: corporate-party-client-credentials
                  key: client-id
            - name: CORPORATE_PARTY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: corporate-party-client-credentials
                  key: client-secret
            - name: CORPORATE_PARTY_SCOPE
              value: party.read
          ports:
            - name: http
              containerPort: 8083
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: corporate-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: corporate-service
  ports:
    - name: http
      port: 8083
      targetPort: http
