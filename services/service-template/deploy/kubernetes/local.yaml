apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-template
  labels:
    app.kubernetes.io/name: service-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-template
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service-template
          image: service-template:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: service-template
  labels:
    app.kubernetes.io/name: service-template
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: service-template
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
