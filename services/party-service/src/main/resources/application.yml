spring:
  application:
    name: party-service
  datasource:
    url: ${PARTY_DATASOURCE_URL:}
    username: ${PARTY_DATASOURCE_USERNAME:}
    password: ${PARTY_DATASOURCE_PASSWORD:}
  flyway:
    enabled: false

party:
  database:
    url: ${PARTY_DATASOURCE_URL:}
    username: ${PARTY_DATASOURCE_USERNAME:}
    password: ${PARTY_DATASOURCE_PASSWORD:}
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    audience: ${PARTY_TOKEN_AUDIENCE:}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never

logging:
  structured:
    format:
      console: logstash
