spring:
  application:
    name: branch-service
  datasource:
    url: ${BRANCH_DATASOURCE_URL:}
    username: ${BRANCH_DATASOURCE_USERNAME:}
    password: ${BRANCH_DATASOURCE_PASSWORD:}
  flyway:
    enabled: false

branch:
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    audience: ${BRANCH_TOKEN_AUDIENCE:}

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never

logging:
  structured:
    format:
      console: logstash
