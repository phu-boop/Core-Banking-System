spring:
  application:
    name: reporting-service
  datasource:
    url: ${REPORTING_DATASOURCE_URL:}
    username: ${REPORTING_DATASOURCE_USERNAME:}
    password: ${REPORTING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    schemas: reporting_schema
    default-schema: reporting_schema

reporting:
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    audience: ${REPORTING_TOKEN_AUDIENCE:reporting-service}

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health
