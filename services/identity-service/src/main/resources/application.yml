spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DATASOURCE_URL:}
    username: ${IDENTITY_DATASOURCE_USERNAME:}
    password: ${IDENTITY_DATASOURCE_PASSWORD:}
  flyway:
    enabled: false

identity:
  database:
    url: ${IDENTITY_DATASOURCE_URL:}
    username: ${IDENTITY_DATASOURCE_USERNAME:}
    password: ${IDENTITY_DATASOURCE_PASSWORD:}
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    audience: ${IDENTITY_TOKEN_AUDIENCE:}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never

logging:
  structured:
    format:
      console: logstash
