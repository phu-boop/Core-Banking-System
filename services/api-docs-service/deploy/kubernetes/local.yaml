apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-docs-service
  labels:
    app.kubernetes.io/name: api-docs-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-docs-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-docs-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-docs-service
          image: api-docs-service:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_PORT
              value: "8090"
            - name: IDENTITY_OPENAPI_URL
              value: "http://identity-service:8080/v3/api-docs"
            - name: PARTY_OPENAPI_URL
              value: "http://party-service:8081/v3/api-docs"
            - name: BRANCH_OPENAPI_URL
              value: "http://branch-service:8082/v3/api-docs"
            - name: CORPORATE_OPENAPI_URL
              value: "http://corporate-service:8083/v3/api-docs"
            - name: ACCOUNT_OPENAPI_URL
              value: "http://account-service:8085/v3/api-docs"
            - name: LEDGER_OPENAPI_URL
              value: "http://ledger-service:8086/v3/api-docs"
            - name: TRANSFER_OPENAPI_URL
              value: "http://transfer-service:8085/v3/api-docs"
            - name: PAYMENT_OPENAPI_URL
              value: "http://payment-service:8086/v3/api-docs"
            - name: AUDIT_OPENAPI_URL
              value: "http://audit-service:8087/v3/api-docs"
            - name: NOTIFICATION_OPENAPI_URL
              value: "http://notification-service:8088/v3/api-docs"
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: api-docs-service
  labels:
    app.kubernetes.io/name: api-docs-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-docs-service
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
